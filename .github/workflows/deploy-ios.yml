name: Build & Deploy Native iOS (SwiftUI) to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🍎 Sélection de la version Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: 🔑 Configuration de la clé API Apple App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: 🔐 Configuration du certificat de distribution Apple (si fourni)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "ci-keychain-temp-pwd"
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "ℹ️ Aucun certificat P12 fourni, Fastlane utilisera l'API Apple avec get_certificates."
            exit 0
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: 🚀 Compilation Native & Téléversement TestFlight (Fastlane)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Compilation Native Xcode (Swift / SwiftUI) et TestFlight sans Expo"
            lane :beta do
              api_key_path = File.expand_path("~/.appstoreconnect/private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_KEY_ID']}.p8")
              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_filepath: api_key_path,
                in_house: false
              )

              # 1. Initialiser le token Spaceship pour l'API Apple
              token = Spaceship::ConnectAPI::Token.create(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                filepath: api_key_path
              )
              Spaceship::ConnectAPI.token = token

              # 2. Création automatique du Bundle ID avec seed_id (Team ID)
              bundle_id_resource = nil
              begin
                b_ids = Spaceship::ConnectAPI.get_bundle_ids(filter: { identifier: "fr.tribufamille.app" }).to_a
                if b_ids.empty?
                  puts "Creating Bundle ID fr.tribufamille.app on Apple Developer..."
                  bundle_id_resource = Spaceship::ConnectAPI.post_bundle_id(
                    name: "Tribu Famille",
                    identifier: "fr.tribufamille.app",
                    platform: "IOS",
                    seed_id: ENV["APPLE_TEAM_ID"]
                  )
                  puts "Bundle ID created successfully!"
                else
                  puts "Bundle ID fr.tribufamille.app already exists on Apple Developer."
                  bundle_id_resource = b_ids.first
                end
              rescue => e
                puts "Note Bundle ID: #{e.message}"
              end

              # 3. Création automatique de l'App sur App Store Connect si elle n'existe pas
              begin
                apps = Spaceship::ConnectAPI.get_apps(filter: { bundleId: "fr.tribufamille.app" }).to_a
                if apps.empty?
                  puts "Creating App on App Store Connect for bundle fr.tribufamille.app..."
                  app_created = nil
                  begin
                    app_created = Spaceship::ConnectAPI.post_app(
                      name: "Tribu Famille - Calendrier",
                      bundle_id: "fr.tribufamille.app",
                      primary_locale: "fr-FR",
                      sku: "fr-tribufamille-#{Time.now.to_i}"
                    )
                    puts "App created on App Store Connect successfully: #{app_created.id}!"
                  rescue => err1
                    puts "Attempt 1 failed: #{err1.message}. Trying with alternate name..."
                    app_created = Spaceship::ConnectAPI.post_app(
                      name: "Tribu Famille Partage",
                      bundle_id: "fr.tribufamille.app",
                      primary_locale: "fr-FR",
                      sku: "fr-tribufamille-#{Time.now.to_i}"
                    )
                    puts "App created on App Store Connect successfully: #{app_created.id}!"
                  end
                else
                  puts "App already exists on App Store Connect: #{apps.first.name} (ID: #{apps.first.id})"
                end
              rescue => e
                puts "Note App Store Connect App: #{e.message}"
              end

              # 4. Téléchargement ou création automatique du profil de provisioning
              get_provisioning_profile(
                app_identifier: "fr.tribufamille.app",
                api_key: api_key
              )

              # 5. Compilation native de l'IPA Release
              build_app(
                project: "TribuFamille.xcodeproj",
                scheme: "TribuFamille",
                configuration: "Release",
                export_method: "app-store",
                output_directory: "./build",
                output_name: "TribuFamille.ipa",
                xcargs: "SDKROOT=iphoneos CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE=#{ENV['SIGH_UUID']} PROVISIONING_PROFILE_SPECIFIER='#{ENV['SIGH_NAME']}'",
                export_options: {
                  signingStyle: "manual",
                  provisioningProfiles: {
                    "fr.tribufamille.app" => ENV["SIGH_UUID"]
                  }
                }
              )

              # 6. Téléversement TestFlight direct
              upload_to_testflight(
                api_key: api_key,
                app_identifier: "fr.tribufamille.app",
                ipa: "./build/TribuFamille.ipa",
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF
          bundle exec fastlane beta || fastlane beta

      - name: 📱 Alerte Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            MSG="🚀 Build Native iOS Tribu Famille (SwiftUI) TERMINÉ avec succès sur TestFlight !"
          else
            MSG="⚠️ Le build Native iOS Tribu Famille s'est terminé avec le statut : $STATUS"
          fi
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=$MSG"
          fi
